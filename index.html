<html>
<head>
    <title>Infinite Terrain World</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

<body class="overflow-hidden bg-blue-100">
    <div id="scene-container" class="absolute top-0 left-0 w-full h-full"></div>
    <div class="absolute top-0 left-0 p-4">
        <label for="color-picker" class="block mb-2 text-sm font-medium text-gray-900">Character Color:</label>
        <input type="color" id="color-picker" value="#ff0000" class="p-1 h-10 w-14 block bg-white border border-gray-300 cursor-pointer rounded-lg disabled:opacity-50 disabled:pointer-events-none">
    </div>
    <div class="absolute bottom-0 left-0 p-4 flex space-x-2">
         <button id="dance-button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Dance
        </button>
         <button id="run-toggle" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
            Run: OFF
        </button>
    </div>
     <div id="stamina-bar-container" class="absolute bottom-16 left-4 w-48 h-4 bg-gray-300 rounded">
        <div id="stamina-bar" class="h-full bg-yellow-400 rounded"></div>
    </div>
